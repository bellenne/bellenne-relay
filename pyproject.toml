[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bellenne-relay"
version = "0.1.1"
description = "BellenneRelay local real-time English and Russian speech translator"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "nvidia-cublas-cu12==12.4.5.8; platform_system == 'Windows'",
    "nvidia-cudnn-cu12==9.1.1.17; platform_system == 'Windows'",
    "numpy>=1.26,<3",
    "PyAudioWPatch==0.2.12.8",
    "PySide6==6.11.2",
    "QtAwesome==1.4.0",
    "sacremoses>=0.1,<1",
    "sentencepiece==0.2.2",
    "torch==2.14.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.2",
    "pytest>=8.0,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
